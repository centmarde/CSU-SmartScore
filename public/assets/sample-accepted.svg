<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="60" y="85" font-family="Inter, Segoe UI, Arial" font-size="44" font-weight="800" fill="#16a34a">
    Accepted ✅
  </text>
  <text x="60" y="130" font-family="Inter, Segoe UI, Arial" font-size="22" fill="#334155">
    Clear, well-lit, flat paper • Answers numbered starting at 1.
  </text>

  <!-- paper -->
  <rect x="110" y="170" width="980" height="440" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="110" y="170" width="980" height="64" rx="18" fill="#e2e8f0"/>
  <text x="150" y="212" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="700" fill="#0f172a">
    Short Answer Sheet (example)
  </text>

  <!-- lines -->
  <g stroke="#dbeafe" stroke-width="3">
    <line x1="150" y1="280" x2="1050" y2="280"/>
    <line x1="150" y1="335" x2="1050" y2="335"/>
    <line x1="150" y1="390" x2="1050" y2="390"/>
    <line x1="150" y1="445" x2="1050" y2="445"/>
    <line x1="150" y1="500" x2="1050" y2="500"/>
    <line x1="150" y1="555" x2="1050" y2="555"/>
  </g>

  <!-- handwriting -->
  <g font-family="Segoe Script, Comic Sans MS, cursive" font-size="34" fill="#0f172a">
    <text x="165" y="270">1. Photosynthesis</text>
    <text x="165" y="325">2. gas giant</text>
    <text x="165" y="380">3. 0°C</text>
    <text x="165" y="435">4. four</text>
    <text x="165" y="490">5. gravity</text>
    <text x="165" y="545">6. Au element</text>
  </g>

  <!-- callouts -->
  <g font-family="Inter, Segoe UI, Arial" font-size="18" fill="#065f46">
    <circle cx="1010" cy="270" r="10" fill="#22c55e"/>
    <text x="1032" y="276">Readable text</text>
    <circle cx="1010" cy="315" r="10" fill="#22c55e"/>
    <text x="1032" y="321">Good contrast</text>
    <circle cx="1010" cy="360" r="10" fill="#22c55e"/>
    <text x="1032" y="366">Numbered answers</text>
  </g>
</svg>
