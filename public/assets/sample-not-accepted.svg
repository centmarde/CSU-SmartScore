<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>

  <text x="60" y="85" font-family="Inter, Segoe UI, Arial" font-size="44" font-weight="800" fill="#dc2626">
    Not accepted ❌
  </text>
  <text x="60" y="130" font-family="Inter, Segoe UI, Arial" font-size="22" fill="#7c2d12">
    Blurry / angled / cropped • No numbering • Dirty background
  </text>

  <!-- messy background -->
  <g opacity="0.35">
    <circle cx="260" cy="510" r="120" fill="#fb7185"/>
    <circle cx="380" cy="520" r="90" fill="#60a5fa"/>
    <circle cx="420" cy="460" r="70" fill="#34d399"/>
    <rect x="820" y="170" width="200" height="120" rx="14" fill="#a78bfa"/>
  </g>

  <!-- tilted paper (parallelogram) -->
  <g filter="url(#shadow2)">
    <path d="M170 190 L1030 140 L1090 560 L220 610 Z" fill="#ffffff"/>
    <path d="M170 190 L1030 140 L1045 200 L185 248 Z" fill="#fed7aa"/>
  </g>

  <!-- blurred text (no numbering) -->
  <g filter="url(#blur)" font-family="Segoe Script, Comic Sans MS, cursive" font-size="38" fill="#111827" opacity="0.85">
    <text x="260" y="325">Photosynthesis</text>
    <text x="260" y="390">gas giant</text>
    <text x="260" y="455">0 C</text>
    <text x="260" y="520">gravity</text>
  </g>

  <!-- problem callouts -->
  <g font-family="Inter, Segoe UI, Arial" font-size="18" fill="#991b1b">
    <circle cx="925" cy="290" r="10" fill="#ef4444"/>
    <text x="948" y="296">Angled / tilted</text>
    <circle cx="925" cy="335" r="10" fill="#ef4444"/>
    <text x="948" y="341">Blurry</text>
    <circle cx="925" cy="380" r="10" fill="#ef4444"/>
    <text x="948" y="386">No numbering (1., 2., 3.)</text>
    <circle cx="925" cy="425" r="10" fill="#ef4444"/>
    <text x="948" y="431">Busy/dirty background</text>
  </g>

  <!-- red crop mark -->
  <g stroke="#ef4444" stroke-width="10" opacity="0.9">
    <line x1="250" y1="610" x2="340" y2="610"/>
    <line x1="250" y1="610" x2="250" y2="520"/>
    <line x1="1090" y1="140" x2="1000" y2="140"/>
    <line x1="1090" y1="140" x2="1090" y2="230"/>
  </g>
</svg>
