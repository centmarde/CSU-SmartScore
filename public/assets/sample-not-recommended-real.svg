<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f2d8"/>
      <stop offset="1" stop-color="#efe6b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#fff7ed"/>

  <text x="60" y="85" font-family="Inter, Segoe UI, Arial" font-size="44" font-weight="800" fill="#dc2626">
    Not recommended ❌
  </text>
  <text x="60" y="130" font-family="Inter, Segoe UI, Arial" font-size="22" fill="#7c2d12">
    Example of a complex handwriting-heavy page (can be hard for AI)
  </text>

  <!-- sheet -->
  <g filter="url(#shadow)">
    <rect x="140" y="160" width="920" height="470" rx="14" fill="url(#paper)"/>
  </g>

  <!-- faint lines -->
  <g stroke="#93c5fd" stroke-width="3" opacity="0.55">
    <line x1="170" y1="260" x2="1030" y2="260"/>
    <line x1="170" y1="320" x2="1030" y2="320"/>
    <line x1="170" y1="380" x2="1030" y2="380"/>
    <line x1="170" y1="440" x2="1030" y2="440"/>
    <line x1="170" y1="500" x2="1030" y2="500"/>
    <line x1="170" y1="560" x2="1030" y2="560"/>
  </g>

  <!-- dense handwritten sentences -->
  <g font-family="Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#0f172a" opacity="0.92">
    <text x="175" y="220">1. Descriptive analytics summarizes historical business data to</text>
    <text x="205" y="250">answer "what happened?"</text>

    <text x="175" y="290">2. The extract step in ETL involves reading raw data from</text>
    <text x="205" y="320">source files like CSV.</text>

    <text x="175" y="360">3. A Data Warehouse is a centralized repository designed for analysis</text>
    <text x="205" y="390">and decision support, not daily transactions.</text>

    <text x="175" y="430">4. In data visualizations, bar charts are best for showing</text>
    <text x="205" y="460">trends over time.</text>

    <text x="175" y="500">5. The python library matplotlib is used for data manipulation and</text>
    <text x="205" y="530">analysis, often with DataFrames.</text>

    <text x="175" y="570">6. OLTP systems are optimized for frequent insert, update, and delete</text>
    <text x="205" y="600">operations.</text>
  </g>

  <!-- highlight boxes (simulate messy annotations) -->
  <g opacity="0.75">
    <rect x="305" y="343" width="280" height="28" rx="6" fill="#a78bfa" opacity="0.45"/>
    <rect x="285" y="483" width="360" height="28" rx="6" fill="#60a5fa" opacity="0.38"/>
  </g>

  <!-- warning bullets -->
  <g font-family="Inter, Segoe UI, Arial" font-size="18" fill="#991b1b">
    <circle cx="900" cy="180" r="9" fill="#ef4444"/>
    <text x="922" y="186">Very long sentences / dense text</text>
    <circle cx="900" cy="214" r="9" fill="#ef4444"/>
    <text x="922" y="220">More chances of missed lines</text>
    <circle cx="900" cy="248" r="9" fill="#ef4444"/>
    <text x="922" y="254">Complex handwriting varies by student</text>
  </g>
</svg>
